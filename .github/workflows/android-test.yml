# Build the Android phone app for a test install. No release signing key is stored in GitHub.
name: Android test build
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK "tools" package has been removed from Google's repository.
          # Gradle downloads the required platform/build-tools; this action only needs adb.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build debug APK
        run: |
          cd app/gradle
          ./gradlew --no-daemon --stacktrace :android:assembleDebug
      - name: Verify APK
        run: |
          test -s app/android/build/outputs/apk/debug/android-debug.apk
          ls -lh app/android/build/outputs/apk/debug/android-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-remote-android-test
          path: app/android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 14
